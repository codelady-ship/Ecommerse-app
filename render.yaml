# Render Blueprint for the HUELINE demo API (free web service).
# Render > New > Blueprint > pick this repo. Secrets marked `sync: false` are asked for in the dashboard;
# nothing secret is stored in this file.
services:
  - type: web
    name: hueline-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://codelady-ship.github.io,http://localhost:5173
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
